<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - Billing Desk</title>

    <link rel="stylesheet" href="customers.css">
</head>

<body>

    <header class="page-header">

        <div>
            <h1 id="shopName">Loading Shop...</h1>
            <p id="shopDetails">Loading shop details...</p>
        </div>

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Shop Dashboard
        </button>

    </header>


    <main class="customers-container">

        <!-- ==========================================
             ADD CUSTOMER
        =========================================== -->

        <section class="card">

            <div class="section-title">

                <div>
                    <h2>Add Customer</h2>
                    <p>Add a new customer to your shop.</p>
                </div>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label for="customerName">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter customer name"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter address"
                    >

                </div>

            </div>


            <button
                type="button"
                class="add-btn"
                onclick="addCustomer()"
            >
                + Add Customer
            </button>

        </section>


        <!-- ==========================================
             MESSAGE
        =========================================== -->

        <p id="message"></p>


        <!-- ==========================================
             CUSTOMER LIST
        =========================================== -->

        <section class="card">

            <div class="section-title">

                <div>
                    <h2>Customers</h2>
                    <p>Customers registered in this shop.</p>
                </div>

                <button
                    type="button"
                    class="refresh-btn"
                    onclick="loadCustomers()"
                >
                    ↻ Refresh
                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>

                    </thead>


                    <tbody id="customersBody">

                        <tr>

                            <td
                                colspan="6"
                                class="loading"
                            >
                                Loading customers...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="customers.js"></script>

</body>

</html>
