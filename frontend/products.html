<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Billing Desk</title>

    <link rel="stylesheet" href="products.css">
</head>

<body>

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="page-header">

        <div>
            <h1 id="shopName">Loading Shop...</h1>
            <p id="shopDetails">Loading shop details...</p>
        </div>

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Shop Dashboard
        </button>

    </header>


    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="products-container">


        <!-- =====================================
             ADD PRODUCT
        ====================================== -->

        <section class="card">

            <div class="section-title">

                <div>
                    <h2>Add Product</h2>
                    <p>Add a new product to your shop.</p>
                </div>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        placeholder="e.g. Grocery"
                    >

                </div>


                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <div class="input-suffix">

                        <input
                            type="number"
                            id="price"
                            min="0"
                            step="0.01"
                            placeholder="0.00"
                        >

                        <span>₹</span>

                    </div>

                </div>


                <div class="form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        step="1"
                        placeholder="0"
                    >

                </div>

            </div>


            <button
                type="button"
                class="add-btn"
                onclick="addProduct()"
            >
                + Add Product
            </button>

        </section>


        <!-- =====================================
             MESSAGE
        ====================================== -->

        <p id="message"></p>


        <!-- =====================================
             PRODUCTS
        ====================================== -->

        <section class="card">

            <div class="section-title">

                <div>
                    <h2>Products</h2>
                    <p>Products available in this shop.</p>
                </div>

                <button
                    type="button"
                    class="refresh-btn"
                    onclick="loadProducts()"
                >
                    ↻ Refresh
                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>

                    </thead>


                    <tbody id="productsBody">

                        <tr>
                            <td
                                colspan="6"
                                class="loading"
                            >
                                Loading products...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="products.js"></script>

</body>

</html>
