<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Billing Desk - Owner Registration</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <h1>Billing Desk</h1>

    <h2>Create Owner Account</h2>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Owner Name"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Create Owner Account
        </button>

    </form>

    <p id="message"></p>

    <script src="register.js"></script>

</body>
</html>
